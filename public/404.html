<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SMARTEURA</title>
    <script>
      // SPA redirect fallback for GitHub Pages
      const hash = location.pathname.replace(/^\/([^\/]+)?\/?/, '');
      if (hash) {
        location.replace(location.origin + (location.pathname.startsWith('/smarteura') ? '/smarteura' : '') + '/#' + hash);
      } else {
        location.replace(location.origin + '/');
      }
    </script>
  </head>
  <body>
  </body>
</html>
